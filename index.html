<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小班数学选择题｜难度版 v13</title>
<style>
  :root {
    --bg: #eef7f6;
    --card: #ffffff;
    --ink: #24324b;
    --muted: #6e7c96;
    --blue: #4267b2;
    --soft-blue: #eaf2ff;
    --cream: #fff7e8;
    --green: #2fc96b;
    --red: #ff6b6b;
    --yellow: #ffce63;
    --shadow: 0 18px 45px rgba(36, 50, 75, 0.10);
    --radius: 34px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  html { overflow-y: auto; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at top, #f6fbf2 0, var(--bg) 48%, #e9f3fb 100%);
    color: var(--ink);
    min-height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .app {
    width: min(940px, 100%);
    margin: 0 auto;
    padding: calc(24px + var(--safe-top)) 18px calc(110px + var(--safe-bottom));
  }
  .topbar {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 10px 0 8px;
    backdrop-filter: blur(8px);
  }
  .brand { font-size: 28px; font-weight: 950; letter-spacing: .3px; white-space: nowrap; }
  .selection-pill {
    display: inline-flex; align-items: center; gap: 10px;
    border: 0; border-radius: 999px;
    background: #fff; color: var(--ink);
    padding: 13px 18px 13px 16px;
    min-height: 58px;
    box-shadow: 0 8px 24px rgba(36,50,75,.10);
    font-size: 18px; font-weight: 900; cursor: pointer;
  }
  .selection-pill .anticon { width: 24px; height: 24px; flex: 0 0 auto; }
  .selection-pill-text { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .difficulty-inline { color: #b27400; letter-spacing: 1px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(30px, 5vw, 48px);
    min-height: 760px;
  }
  .meta-row {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px;
  }
  .tag-wrap { display:flex; flex-wrap:wrap; align-items:center; gap: 12px; }
  .tag {
    display: inline-flex; align-items: center; background: #eef4ff; color: #4365ad;
    font-size: clamp(20px, 3.4vw, 27px); font-weight: 950; border-radius: 999px; padding: 12px 22px;
  }
  .difficulty-badge {
    display:inline-flex; align-items:center; gap: 8px;
    background:#fff6df; color:#9a6400; border-radius:999px;
    padding: 11px 18px; font-size: clamp(18px, 3vw, 24px); font-weight:950;
  }
  .stars { letter-spacing: 2px; color:#e0a400; }
  .counter { color: var(--muted); font-weight: 900; font-size: 19px; white-space: nowrap; }
  .prompt-row { display:flex; align-items:flex-start; gap: 14px; margin: 20px 0 24px; }
  .prompt { flex: 1; font-size: clamp(34px, 6vw, 50px); line-height: 1.16; font-weight: 950; letter-spacing: .2px; }
  .sound-btn {
    border: 0; border-radius: 20px; background: #eaf2ff; color: #4564a9;
    min-width: 62px; height: 62px; display:grid; place-items:center; cursor:pointer;
    box-shadow: inset 0 0 0 2px rgba(66,103,178,.08);
  }
  .sound-btn .anticon { width: 30px; height: 30px; }
  .visual {
    background: var(--cream); border-radius: 28px; min-height: 270px; padding: 26px;
    display: grid; place-items: center; overflow: hidden;
  }
  .options { margin-top: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .option-btn {
    position:relative; border:0; border-radius:24px; min-height:104px; padding: 16px 16px;
    background: var(--soft-blue); color: var(--ink); font-size: clamp(28px, 5.4vw, 42px); font-weight:950;
    cursor:pointer; transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 0 rgba(36,50,75,.04);
    overflow:hidden;
  }
  .option-btn:hover { transform: translateY(-2px); }
  .option-btn:active { transform: scale(.985); }
  .option-btn.correct { background: #d9f8df; outline: 5px solid rgba(47,201,107,.25); }
  .option-btn.wrong { background: #ffe4e4; outline: 5px solid rgba(255,107,107,.23); }
  .option-content { display:flex; align-items:center; justify-content:center; gap: 10px; min-height: 70px; padding-right: 0; }
  .option-btn.has-sound .option-content { padding-right: 54px; }
  .option-sound {
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    border:0; border-radius: 15px; width: 48px; height: 48px;
    background: rgba(255,255,255,.72); color: #4564a9; display:grid; place-items:center; cursor:pointer;
  }
  .option-sound .anticon { width: 24px; height:24px; }
  .feedback { min-height: 68px; margin-top: 22px; font-size: clamp(26px, 4.6vw, 34px); font-weight: 950; display:flex; align-items:center; }
  .feedback.good { color: #149447; }
  .feedback.bad { color: #d14b4b; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  .nav button {
    border:0; border-radius:999px; min-height:68px; background:#24324b; color:#fff;
    font-size:22px; font-weight:950; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .nav button.secondary { background:#dfe9f7; color:var(--ink); }
  .nav button:disabled { opacity:.45; cursor:not-allowed; }
  .nav .anticon { width:28px; height:28px; }
  .progress { height: 12px; background: rgba(36,50,75,.08); border-radius: 999px; overflow:hidden; margin-top: 24px; }
  .bar-fill { height:100%; width:0; background: linear-gradient(90deg, #75d98b, #77a7ff); border-radius:999px; transition: width .25s ease; }
  .score-panel { margin-top:16px; color: var(--muted); font-size:19px; font-weight:900; text-align:center; }

  .drawer-backdrop { position:fixed; inset:0; z-index:100; background:rgba(20,30,45,.34); opacity:0; pointer-events:none; transition: opacity .22s ease; }
  .drawer-backdrop.show { opacity:1; pointer-events:auto; }
  .top-drawer {
    position:fixed; left:50%; top:0; z-index:101; transform:translate(-50%,-105%);
    width:min(940px, calc(100% - 20px)); max-height:min(88vh, 920px); overflow:auto;
    padding: calc(18px + var(--safe-top)) 18px 24px;
    background:rgba(255,255,255,.98); border-radius:0 0 34px 34px; box-shadow:0 26px 70px rgba(20,30,45,.22);
    transition: transform .26s ease; -webkit-overflow-scrolling:touch;
  }
  .top-drawer.show { transform:translate(-50%,0); }
  body.drawer-open { overflow:hidden; touch-action:none; }
  .drawer-handle { width:74px; height:7px; border-radius:999px; background:#d8e1ef; margin:4px auto 16px; }
  .drawer-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
  .drawer-title { font-size:28px; font-weight:950; }
  .drawer-subtitle { color:var(--muted); font-size:16px; font-weight:800; margin-top:4px; }
  .drawer-close { border:0; width:52px; height:52px; border-radius:18px; background:#eef4ff; color:#4564a9; display:grid; place-items:center; cursor:pointer; }
  .drawer-close .anticon { width:26px; height:26px; }
  .drawer-section-title { margin: 18px 0 12px; color:var(--muted); font-size:17px; font-weight:950; letter-spacing:.5px; }
  .difficulty-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; }
  .difficulty-card, .drawer-random, .type-card {
    border:0; text-align:left; border-radius:24px; background:#f5f8ff; color:var(--ink); cursor:pointer;
    box-shadow: inset 0 0 0 2px rgba(66,103,178,.05); transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  .difficulty-card { padding: 18px 18px; min-height: 98px; }
  .difficulty-card strong { display:block; font-size:23px; font-weight:950; }
  .difficulty-card .stars { display:block; margin-top:8px; font-size:26px; }
  .difficulty-card.active, .drawer-random.active, .type-card.active { background:#fff7dc; box-shadow: inset 0 0 0 4px rgba(255,206,99,.50); }
  .drawer-random { width:100%; padding: 20px; min-height:100px; display:flex; align-items:center; gap:16px; }
  .drawer-random-icon { width:58px; height:58px; border-radius:20px; background:#fff; display:grid; place-items:center; color:#4267b2; }
  .drawer-random-icon .anticon { width:34px; height:34px; }
  .drawer-random-text strong { display:block; font-size:25px; font-weight:950; }
  .drawer-random-text small { display:block; color:var(--muted); margin-top:5px; font-size:15px; font-weight:800; }
  .type-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; }
  .type-card { min-height:98px; padding:16px; }
  .type-card strong { display:block; font-size:20px; font-weight:950; line-height:1.2; }
  .type-card small { display:block; color:var(--muted); margin-top:8px; font-size:15px; font-weight:800; }
  .difficulty-card:active, .drawer-random:active, .type-card:active, .drawer-close:active { transform:scale(.985); }

  .emoji { display:inline-block; font-size:52px; margin:6px; line-height:1; }
  .big-emoji { display:inline-block; font-size:74px; margin:8px 12px; }
  .visual-grid { max-width:650px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px; }
  .dense-count .emoji { font-size:42px; margin:4px; }
  .mini-grid { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; max-width:260px; }
  .number-bubbles { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; }
  .number-bubble { width:92px; height:92px; display:inline-grid; place-items:center; border-radius:26px; background:#fff; color:#24324b; font-size:44px; font-weight:950; box-shadow:inset 0 0 0 5px #dfe9f7; }
  .target-ring { box-shadow:inset 0 0 0 5px #dfe9f7; }
  .big-digit-card { width:180px; height:180px; border-radius:42px; background:#fff; display:grid; place-items:center; font-size:108px; font-weight:1000; box-shadow:inset 0 0 0 7px #dfe9f7; }
  .option-set { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; max-width:100%; }
  .option-set .emoji { font-size:32px; margin:1px; }
  .two-groups { display:grid; grid-template-columns:1fr 1fr; gap:20px; width:100%; max-width:650px; }
  .group-card { background:#fff; border-radius:24px; min-height:190px; padding:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .group-label { color:var(--blue); font-weight:950; font-size:30px; margin-bottom:8px; }
  .group-card .emoji { font-size:34px; margin:1px; }
  .height-scene { position:relative; height:270px; width:100%; max-width:650px; display:flex; justify-content:center; align-items:flex-end; gap:clamp(60px,16vw,130px); padding-bottom:34px; }
  .height-scene .ground { position:absolute; left:8%; right:8%; bottom:50px; height:7px; border-radius:999px; background:#69a35b; }
  .height-item { position:relative; z-index:1; width:150px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .height-box { height:170px; width:170px; display:flex; align-items:flex-end; justify-content:center; line-height:1; }
  .object-label { margin-top:8px; font-size:28px; font-weight:950; color:var(--blue); }
  .length-scene { width:100%; max-width:650px; display:grid; gap:30px; padding:18px 0; }
  .length-row { display:flex; align-items:center; gap:16px; font-size:28px; font-weight:950; }
  .length-name { width:50px; height:50px; display:grid; place-items:center; border-radius:14px; background:#fff; color:var(--blue); }
  .bar { display:inline-block; height:34px; border-radius:999px; background:linear-gradient(180deg,#42d94d,#05a821); box-shadow:inset 0 3px 0 rgba(255,255,255,.5); max-width:70vw; }
  .compare-numbers { display:flex; align-items:center; justify-content:center; gap:34px; font-size:clamp(72px,15vw,118px); font-weight:1000; }
  .sign-hole { width:120px; height:120px; border-radius:30px; display:grid; place-items:center; background:#fff; border:7px dashed #7c93c8; }
  .pattern-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; }
  .pattern-tile { width:82px; height:82px; display:grid; place-items:center; border-radius:22px; background:#fff; font-size:40px; font-weight:950; }
  .blank-tile { border:6px dashed #7c93c8; background:#edf4ff; }
  .category-card { text-align:center; background:#fff; border-radius:28px; padding:28px 44px; }
  .small-title { color:var(--muted); font-size:24px; font-weight:900; margin-bottom:8px; }
  .odd-row { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; }
  .odd-item { position:relative; width:105px; height:115px; border-radius:24px; background:#fff; display:grid; place-items:center; font-size:54px; font-weight:950; }
  .pos { position:absolute; left:10px; top:8px; font-size:18px; color:var(--blue); font-weight:950; }
  .shuffle-card { background:#fff; border-radius:28px; padding:32px 42px; font-size:clamp(42px,9vw,72px); font-weight:1000; text-align:center; }
  .sequence-row { display:flex; justify-content:center; flex-wrap:wrap; gap:14px; }
  .seq-box { width:96px; height:96px; border-radius:24px; display:grid; place-items:center; background:#fff; font-size:54px; font-weight:1000; }
  .seq-box.blank { background:#edf4ff; border:7px dashed #7c93c8; }
  .math-visual { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:18px; font-size:52px; font-weight:1000; }
  .math-visual .emoji { font-size:40px; margin:2px; }
  .op { font-size:64px; font-weight:1000; }
  .crossed { position:relative; opacity:.42; }
  .crossed:after { content:""; position:absolute; left:8px; right:8px; top:50%; height:6px; background:#e84e4e; transform:rotate(-18deg); border-radius:999px; }
  .shapes-row { display:flex; flex-wrap:wrap; justify-content:center; gap:22px; font-size:76px; font-weight:1000; }
  .shape-token { width:104px; height:104px; display:grid; place-items:center; background:#fff; border-radius:26px; }
  .space-scene { width:100%; max-width:600px; height:270px; position:relative; background:rgba(255,255,255,.45); border-radius:26px; }
  .space-object { position:absolute; font-size:54px; transform:translate(-50%,-50%); line-height:1; }
  .ball { color:#ef5f78; font-size:60px; }
  .table { position:absolute; left:26%; top:44%; width:48%; height:28px; border-radius:999px; background:#8b5a36; }
  .table:before, .table:after { content:""; position:absolute; top:24px; width:16px; height:90px; background:#8b5a36; border-radius:999px; }
  .table:before { left:14%; } .table:after { right:14%; }
  .box { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:190px; height:130px; border:9px solid #7c93c8; border-radius:22px; display:grid; place-items:center; font-size:58px; background:rgba(237,244,255,.75); }
  .ring { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:160px; height:160px; border:10px solid #7c93c8; border-radius:50%; display:grid; place-items:center; font-size:60px; background:rgba(237,244,255,.55); }
  .corner-dot { position:absolute; font-size:36px; }
  .celebration { position:fixed; inset:0; z-index:130; display:none; place-items:center; background:rgba(20,30,45,.42); padding:20px; }
  .celebration.show { display:grid; }
  .celebration-card { width:min(560px,100%); background:#fff; border-radius:34px; box-shadow:0 26px 70px rgba(20,30,45,.25); padding:42px 30px; text-align:center; }
  .celebration-icons { font-size:74px; line-height:1.2; margin-bottom:10px; }
  .celebration-title { font-size:44px; font-weight:1000; margin-bottom:12px; }
  .celebration-score { font-size:32px; font-weight:950; color:#149447; margin-bottom:16px; }
  .celebration-stars { font-size:44px; color:#e0a400; letter-spacing:5px; margin-bottom:22px; }
  .celebration-close { border:0; border-radius:999px; background:#24324b; color:white; min-height:62px; padding:0 30px; font-size:22px; font-weight:950; cursor:pointer; }
  .anticon { display:inline-block; vertical-align:-0.125em; fill:currentColor; }

  @media (min-width: 760px) and (max-width: 1180px) {
    .app { width:100%; padding-left:22px; padding-right:22px; padding-bottom:calc(128px + var(--safe-bottom)); }
    .card { min-height:auto; padding:38px; }
    .visual { min-height:288px; }
    .options { gap:18px; }
    .option-btn { min-height:108px; }
    .prompt { font-size:48px; }
    .type-grid { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .top-drawer { width:calc(100% - 24px); }
  }
  @media (max-width: 680px) {
    .app { padding:18px 8px calc(96px + var(--safe-bottom)); }
    .topbar { align-items:flex-start; }
    .brand { font-size:24px; }
    .selection-pill { min-height:52px; padding:10px 14px; font-size:15px; }
    .selection-pill-text { max-width:220px; }
    .card { border-radius:28px; padding:22px; min-height:auto; }
    .meta-row { align-items:flex-start; }
    .counter { font-size:16px; }
    .prompt-row { gap:10px; }
    .sound-btn { min-width:54px; height:54px; border-radius:18px; }
    .visual { min-height:220px; padding:16px; }
    .options { gap:14px; grid-template-columns:1fr 1fr; }
    .option-btn { min-height:84px; border-radius:20px; font-size:28px; }
    .option-btn.has-sound .option-content { padding-right:42px; }
    .option-sound { width:40px; height:40px; right:8px; }
    .emoji { font-size:40px; }
    .dense-count .emoji { font-size:30px; }
    .two-groups { gap:12px; }
    .group-card .emoji { font-size:28px; }
    .height-scene { gap:24px; }
    .height-item { width:120px; }
    .height-box { width:130px; }
    .bar { max-width:54vw; }
    .difficulty-grid, .type-grid { grid-template-columns:1fr 1fr; }
    .difficulty-card, .type-card { min-height:88px; }
    .top-drawer { width:calc(100% - 12px); max-height:92vh; padding-left:12px; padding-right:12px; }
  }


  /* v13 drawer layout fix: iPad-friendly card grid, no emoji marks in UI cards */
  .top-drawer {
    width: min(960px, calc(100% - 28px));
    max-height: min(calc(100dvh - 14px), 940px);
    padding: calc(18px + var(--safe-top)) 22px calc(30px + var(--safe-bottom));
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .drawer-head { margin-bottom: 20px; }
  .drawer-section-title {
    margin: 22px 0 12px;
    padding-left: 4px;
  }
  .difficulty-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  .difficulty-card {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height: 96px;
    padding: 16px 12px;
    width: 100%;
  }
  .difficulty-card strong { font-size: 24px; line-height: 1.15; }
  .difficulty-card .stars { font-size: 26px; line-height: 1; }
  .drawer-random {
    margin-bottom: 16px;
    min-height: 96px;
    border-radius: 26px;
  }
  .drawer-random-icon {
    flex: 0 0 58px;
  }
  .drawer-random-text { min-width: 0; }
  .drawer-random-text strong,
  .drawer-random-text small {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .type-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    align-items: stretch;
  }
  .type-card {
    width: 100%;
    min-height: 88px;
    padding: 14px 16px;
    display:flex;
    align-items:center;
    gap: 14px;
    border-radius: 24px;
    text-align:left;
  }
  .type-index {
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    display:grid;
    place-items:center;
    border-radius: 18px;
    background:#fff;
    color:#4267b2;
    font-size: 22px;
    font-weight: 1000;
    box-shadow: inset 0 0 0 2px rgba(66,103,178,.08);
  }
  .type-main {
    min-width: 0;
    flex: 1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap: 8px;
  }
  .type-title {
    display:block;
    min-width:0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 23px;
    font-weight: 950;
    line-height: 1.18;
  }
  .type-meta {
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
  }
  .type-chip {
    display:inline-flex;
    align-items:center;
    min-height: 26px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(66,103,178,.10);
    color: #5d6f90;
    font-size: 14px;
    font-weight: 900;
    line-height: 1;
  }
  .type-card.active .type-index {
    background:#ffec9f;
    color:#8b6200;
    box-shadow: inset 0 0 0 2px rgba(255,206,99,.62);
  }
  .type-card.active .type-chip {
    background: rgba(255,206,99,.34);

let currentDifficulty = 2;
let selectedType = 'random';
let currentList = [];
let index = 0;
let correctIds = new Set();
let wrongChoice = null;
let completed = false;
let audioCtx = null;
let currentVoiceAudio = null;
let voiceSequence = 0;
let voices = [];

const els = {
  menuBtn: document.getElementById('menuBtn'), menuIcon: document.getElementById('menuIcon'), selectionText: document.getElementById('selectionText'),
  tag: document.getElementById('tag'), difficultyBadge: document.getElementById('difficultyBadge'), counter: document.getElementById('counter'),
  prompt: document.getElementById('prompt'), visual: document.getElementById('visual'), options: document.getElementById('options'), feedback: document.getElementById('feedback'),
  speakQuestionBtn: document.getElementById('speakQuestionBtn'), prevBtn: document.getElementById('prevBtn'), nextBtn: document.getElementById('nextBtn'),
  prevIcon: document.getElementById('prevIcon'), nextIcon: document.getElementById('nextIcon'), barFill: document.getElementById('barFill'), scorePanel: document.getElementById('scorePanel'),
  drawer: document.getElementById('drawer'), drawerBackdrop: document.getElementById('drawerBackdrop'), drawerClose: document.getElementById('drawerClose'), closeIcon: document.getElementById('closeIcon'),
  difficultyGrid: document.getElementById('difficultyGrid'), typeGrid: document.getElementById('typeGrid'), randomCard: document.getElementById('randomCard'), randomIcon: document.getElementById('randomIcon'), randomCardSmall: document.getElementById('randomCardSmall'),
  drawerSubtitle: document.getElementById('drawerSubtitle'), celebration: document.getElementById('celebration'), celebrationScore: document.getElementById('celebrationScore'), celebrationClose: document.getElementById('celebrationClose')
};

function initIcons() {
  els.menuIcon.innerHTML = ICONS.menu;
  els.closeIcon.innerHTML = ICONS.close;
  els.prevIcon.innerHTML = ICONS.left;
  els.nextIcon.innerHTML = ICONS.right;
  els.speakQuestionBtn.innerHTML = ICONS.sound;
  els.randomIcon.innerHTML = ICONS.random;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function containsChinese(text) { return /[一-鿿]/.test(text || ''); }
function symbolSpeakText(text) {
  const t = String(text || '').trim();
  if (t === '>' || t === '＞') return '大于号';
  if (t === '<' || t === '＜') return '小于号';
  if (t === '=' || t === '＝') return '等号';
  if (t === '■' || t === '□') return '正方形';
  if (t === '▬') return '长方形';
  if (t === '▲') return '三角形';
  if (t === '◆') return '菱形';
  if (t === '○' || t === '●') return '圆形';
  if (t === '◐') return '半圆';
  if (t === '★') return '星形';
  return '';
}
function shouldShowOptionSound(text) {
  return containsChinese(text) || !!symbolSpeakText(text);
}
function normalizeOptionSpeak(visible, rawSpeak) {
  return symbolSpeakText(visible) || symbolSpeakText(rawSpeak) || rawSpeak || visible;
}
function safeOptionHtml(opt, visible) {
  const t = String(visible || '').trim();
  if (t === '>') return '&gt;';
  if (t === '<') return '&lt;';
  if (t === '=') return '=';
  if (t === '＞') return '＞';
  if (t === '＜') return '＜';
  if (t === '＝') return '＝';
  return opt;
}
function stripHtml(str) { const div = document.createElement('div'); div.innerHTML = str; return (div.textContent || div.innerText || '').trim(); }

function buildDifficultyCards() {
  els.difficultyGrid.innerHTML = Object.keys(DIFFICULTIES).map(key => {
    const d = DIFFICULTIES[key];
    return `<button class="difficulty-card" data-diff="${key}"><strong>${d.name}</strong><span class="stars">${d.stars}</span></button>`;
  }).join('');
  els.difficultyGrid.querySelectorAll('.difficulty-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const diff = Number(btn.dataset.diff);
      if (diff !== currentDifficulty) {
        currentDifficulty = diff;
        correctIds = new Set();
        completed = false;
        rebuildCurrentList(true);
      }
      updateDrawerActive();
      updateSelectionText();
      speakImmediate(`已选择${DIFFICULTIES[String(currentDifficulty)].name}难度。`);
    });
  });
}

function buildTypeCards() {
  els.typeGrid.innerHTML = Object.keys(TYPE_NAMES).map(id => {
    return `<button class="type-card" data-type="${id}" aria-label="${TYPE_NAMES[id]}">
      <span class="type-index">${id}</span>
      <span class="type-main">
        <span class="type-title">${TYPE_NAMES[id]}</span>
        <span class="type-meta"><span class="type-chip">10题</span><span class="type-chip">当前难度</span></span>
      </span>
    </button>`;
  }).join('');
  els.typeGrid.querySelectorAll('.type-card').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedType = Number(btn.dataset.type);
      correctIds = new Set();
      completed = false;
      rebuildCurrentList(false);
      updateDrawerActive();
      closeDrawer();
      speakImmediate(`已选择${TYPE_NAMES[selectedType]}。`);
      setTimeout(() => speakCurrentQuestion(), 420);
    });
  });
}

function updateDrawerActive() {
  els.difficultyGrid.querySelectorAll('.difficulty-card').forEach(btn => btn.classList.toggle('active', Number(btn.dataset.diff) === currentDifficulty));
  els.randomCard.classList.toggle('active', selectedType === 'random');
  els.typeGrid.querySelectorAll('.type-card').forEach(btn => btn.classList.toggle('active', Number(btn.dataset.type) === selectedType));
  els.randomCardSmall.textContent = `${DIFFICULTIES[String(currentDifficulty)].name}难度内随机 ${TOTAL_PER_DIFFICULTY} 题`;
  els.drawerSubtitle.textContent = `${DIFFICULTIES[String(currentDifficulty)].name} ${DIFFICULTIES[String(currentDifficulty)].stars} · ${selectedType === 'random' ? '随机题型' : TYPE_NAMES[selectedType]}`;
}

function updateSelectionText() {
  const d = DIFFICULTIES[String(currentDifficulty)];
  const t = selectedType === 'random' ? '随机题型' : TYPE_NAMES[selectedType];
  els.selectionText.innerHTML = `${d.name} <span class="difficulty-inline">${d.stars}</span> · ${t}`;
  els.difficultyBadge.innerHTML = `<span>${d.name}</span><span class="stars">${d.stars}</span>`;
}

function rebuildCurrentList(keepDrawerOpen) {
  let base = QUESTIONS.filter(q => q.difficulty === currentDifficulty);
  if (selectedType !== 'random') base = base.filter(q => q.typeId === selectedType);
  currentList = selectedType === 'random' ? shuffle(base) : [...base];
  index = 0;
  wrongChoice = null;
  render();
  updateSelectionText();
  updateDrawerActive();
  scrollToQuizTop();
}

function render() {
  if (!currentList.length) return;
  const q = currentList[index];
  els.tag.textContent = `${q.typeId}. ${q.typeName}`;
  els.counter.textContent = `${index + 1} / ${currentList.length}`;
  els.prompt.textContent = q.prompt;
  els.visual.innerHTML = q.visual;
  els.options.innerHTML = '';
  els.feedback.textContent = '';
  els.feedback.className = 'feedback';

  q.options.forEach((opt, i) => {
    const visible = stripHtml(opt);
    const optionSpeak = normalizeOptionSpeak(visible, q.optionSpeaks[i]);
    const hasSound = shouldShowOptionSound(visible);
    const displayHtml = safeOptionHtml(opt, visible);
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (hasSound ? ' has-sound' : '');
    btn.dataset.idx = String(i);
    btn.innerHTML = `<span class="option-content">${displayHtml}</span>`;
    btn.addEventListener('click', () => choose(i));
    if (hasSound) {
      const sbtn = document.createElement('button');
      sbtn.className = 'option-sound';
      sbtn.type = 'button';
      sbtn.setAttribute('aria-label', `播放选项：${optionSpeak}`);
      sbtn.innerHTML = ICONS.sound;
      sbtn.addEventListener('click', ev => { ev.stopPropagation(); unlockAudio(); speakImmediate(optionSpeak); });
      btn.appendChild(sbtn);
    }
    els.options.appendChild(btn);
  });

  if (correctIds.has(q.id)) showCorrectState(false);
  else if (wrongChoice !== null) showWrongState(wrongChoice, false);

  els.prevBtn.disabled = index === 0;
  els.nextBtn.querySelector('span:first-child').textContent = index === currentList.length - 1 ? '完成' : '下一题';
  els.barFill.style.width = `${((index + 1) / currentList.length) * 100}%`;
  updateScorePanel();
}

function choose(choice) {
  unlockAudio();
  const q = currentList[index];
  if (correctIds.has(q.id)) return;
  if (choice === q.answer) {
    correctIds.add(q.id);
    wrongChoice = null;
    showCorrectState(true);
    updateScorePanel();
    playTone('correct');
    speakImmediate('答对啦，真棒！');
    checkComplete();
  } else {
    wrongChoice = choice;
    showWrongState(choice, true);
    playTone('wrong');
    speakImmediate('答错啦，再看看。');
  }
}

function showCorrectState(withFeedback) {
  const q = currentList[index];
  [...els.options.querySelectorAll('.option-btn')].forEach((btn, i) => {
    btn.classList.toggle('correct', i === q.answer);
    btn.classList.remove('wrong');
  });
  if (withFeedback || correctIds.has(q.id)) {
    els.feedback.textContent = `✅ 对！${q.explanation}`;
    els.feedback.className = 'feedback good';
  }
}

function showWrongState(choice, withFeedback) {
  [...els.options.querySelectorAll('.option-btn')].forEach((btn, i) => {
    btn.classList.toggle('wrong', i === choice);
    btn.classList.remove('correct');
  });
  if (withFeedback || wrongChoice !== null) {
    els.feedback.textContent = '❌ 答错啦，再看看。';
    els.feedback.className = 'feedback bad';
  }
}

function updateScorePanel() {
  const currentCorrect = currentList.filter(q => correctIds.has(q.id)).length;
  els.scorePanel.textContent = `答对 ${currentCorrect} / ${currentList.length}`;
}

function checkComplete() {
  if (completed) return;
  const currentCorrect = currentList.filter(q => correctIds.has(q.id)).length;
  if (currentCorrect === currentList.length) {
    completed = true;
    setTimeout(() => {
      els.celebrationScore.textContent = `答对 ${currentCorrect} / ${currentList.length}`;
      els.celebration.classList.add('show');
      playTone('finish');
      speakImmediate('恭喜你，全部答对啦！');
    }, 450);
  }
}

function openDrawer() {
  els.drawer.classList.add('show');
  els.drawerBackdrop.classList.add('show');
  document.body.classList.add('drawer-open');
  updateDrawerActive();
}
function closeDrawer() {
  els.drawer.classList.remove('show');
  els.drawerBackdrop.classList.remove('show');
  document.body.classList.remove('drawer-open');
}

function scrollToQuizTop() {
  const top = document.getElementById('quizCard').getBoundingClientRect().top + window.scrollY - 92;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}

function currentQuestion() { return currentList[index]; }
function speakCurrentQuestion(prefix = '') {
  const q = currentQuestion();
  if (!q) return;
  speakQueue(prefix ? [prefix, q.speak || q.prompt] : [q.speak || q.prompt]);
}

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

function playTone(type) {
  try {
    unlockAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + (type === 'finish' ? 0.75 : 0.32));
    const freqs = type === 'wrong' ? [220, 150] : type === 'finish' ? [523, 659, 784] : [523, 784];
    freqs.forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      osc.type = type === 'wrong' ? 'square' : 'sine';
      osc.frequency.setValueAtTime(f, now + idx * 0.13);
      osc.connect(gain);
      osc.start(now + idx * 0.13);
      osc.stop(now + idx * 0.13 + 0.16);
    });
  } catch (e) {}
}

function loadVoices() {
  try { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voices = []; }
}
function pickVoice() {
  if (!voices || !voices.length) loadVoices();
  return voices.find(v => /Tingting|Xiaoxiao|Meijia|Sinji|普通话|中文女|Chinese.*Female/i.test(v.name)) ||
    voices.find(v => /zh|cmn|Chinese|普通话|中文/i.test(v.lang + v.name)) ||
    voices[0] ||
    null;
}
function normalizeVoiceText(text) {
  return String(text || '').trim().replace(/\s+/g, ' ');
}
function voiceHash(text) {
  const t = normalizeVoiceText(text);
  let h = 0x811c9dc5;
  for (let i = 0; i < t.length; i++) {
    h ^= t.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}
function stopVoicePlayback() {
  try {
    voiceSequence += 1;
    if (currentVoiceAudio) {
      currentVoiceAudio.pause();
      currentVoiceAudio.currentTime = 0;
      currentVoiceAudio = null;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  } catch (e) {}
}
function playVoiceFile(text, seq) {
  return new Promise(resolve => {
    const clean = normalizeVoiceText(text);
    if (!clean) return resolve(true);
    const audio = new Audio(`audio/${voiceHash(clean)}.m4a`);
    currentVoiceAudio = audio;
    audio.preload = 'auto';
    audio.onended = () => resolve(seq === voiceSequence);
    audio.onerror = () => resolve(false);
    audio.onabort = () => resolve(false);
    const started = audio.play();
    if (started && typeof started.catch === 'function') started.catch(() => resolve(false));
  });
}
function speakWithSystemVoice(text, seq) {
  return new Promise(resolve => {
    if (!text || !('speechSynthesis' in window)) return resolve();
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 1.02;
      u.pitch = 1.08;
      u.volume = 1;
      const voice = pickVoice();
      if (voice) u.voice = voice;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    } catch (e) {
      resolve();
    }
  });
}
async function speakQueue(parts) {
  const items = parts.map(normalizeVoiceText).filter(Boolean);
  if (!items.length) return;
  stopVoicePlayback();
  const seq = voiceSequence;
  for (const item of items) {
    if (seq !== voiceSequence) return;
    const usedPack = await playVoiceFile(item, seq);
    if (!usedPack && seq === voiceSequence) await speakWithSystemVoice(item, seq);
  }
}
function speakImmediate(text) {
  speakQueue([text]);
}

els.menuBtn.addEventListener('click', () => { unlockAudio(); openDrawer(); });
els.drawerClose.addEventListener('click', closeDrawer);
els.drawerBackdrop.addEventListener('click', closeDrawer);
els.randomCard.addEventListener('click', () => {
  selectedType = 'random';
  correctIds = new Set();
  completed = false;
  rebuildCurrentList(false);
  closeDrawer();
  speakImmediate(`已选择随机题型，${DIFFICULTIES[String(currentDifficulty)].name}难度。`);
  setTimeout(() => speakCurrentQuestion(), 450);
});
els.speakQuestionBtn.addEventListener('click', () => { unlockAudio(); speakCurrentQuestion(); });
els.prevBtn.addEventListener('click', () => {
  unlockAudio();
  if (index > 0) {
    index -= 1; wrongChoice = null; render(); scrollToQuizTop(); speakCurrentQuestion('上一题。');
  }
});
els.nextBtn.addEventListener('click', () => {
  unlockAudio();
  if (index < currentList.length - 1) {
    index += 1; wrongChoice = null; render(); scrollToQuizTop(); speakCurrentQuestion('下一题。');
  } else {
    const currentCorrect = currentList.filter(q => correctIds.has(q.id)).length;
    if (currentCorrect === currentList.length) {
      checkComplete();
    } else {
      els.feedback.textContent = `还有题目没答对，继续加油！`;
      els.feedback.className = 'feedback bad';
      speakImmediate('还有题目没答对，继续加油！');
    }
  }
});
els.celebrationClose.addEventListener('click', () => { els.celebration.classList.remove('show'); });
document.addEventListener('pointerdown', unlockAudio, { once: true });
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

initIcons();
buildDifficultyCards();
buildTypeCards();
rebuildCurrentList(false);
updateSelectionText();
